name: Standalone deterministic online tests
on:
  push:
    branches:
      - feature/standalone-deterministic-online
      - standalone-csv-free
  pull_request:
    paths:
      - 'standalone_online.py'
      - 'test_standalone_online.py'
      - 'platform_aware_augment_standalone.py'
      - '.github/workflows/standalone-online.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile standalone_online.py platform_aware_augment_standalone.py
      - run: python -m unittest -v test_standalone_empirical.py test_standalone_online.py
